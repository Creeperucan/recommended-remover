<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Settings</title>
	<link rel="stylesheet" href="css/settings.css">
	<script src="js/settings.js" defer></script>
	<script src="js/updateChecker.js" defer></script>
</head>
<body>
	<main class="popup-shell">
		<div class="settings-content">
			<h1 class="popup-title" data-i18n="settingsTitle">Settings</h1>
			<section class="settings-section" aria-labelledby="features-heading">
				<h2 id="features-heading" class="section-heading" data-i18n="settingsFeatures">Features</h2>
				<div class="setting-row">
					<div class="setting-copy">
						<label class="setting-label" for="badges-enabled" data-i18n="settingsBadges">Channel badges</label>
						<p class="setting-description" data-i18n="settingsBadgesDescription">Show channel labels on YouTube</p>
					</div>
					<label class="switch" aria-label="Channel badges">
						<input id="badges-enabled" type="checkbox" role="switch">
						<span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
					</label>
				</div>
				<div class="setting-row">
					<div class="setting-copy">
						<label class="setting-label" for="button-text-enabled" data-i18n="settingsButtonText">Recommendation button text</label>
						<p class="setting-description" data-i18n="settingsButtonTextDescription">Show text beside the visibility icon</p>
					</div>
					<label class="switch" aria-label="Recommendation button text">
						<input id="button-text-enabled" type="checkbox" role="switch" checked>
						<span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
					</label>
				</div>
			</section>

			<section class="settings-section appearance-section" aria-labelledby="appearance-heading">
				<h2 id="appearance-heading" class="section-heading" data-i18n="settingsAppearance">Appearance</h2>
				<div class="setting-row theme-row">
					<span class="setting-label" data-i18n="settingsTheme">Color theme</span>
					<div class="theme-options" role="group" aria-label="Color theme">
						<button class="theme-option" type="button" data-theme-option="light" aria-pressed="true">
							<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
								<circle cx="10" cy="10" r="3.2" stroke="currentColor" stroke-width="1.5" />
								<path d="M10 2.5v1.6m0 11.8v1.6M2.5 10h1.6m11.8 0h1.6M4.7 4.7l1.1 1.1m8.4 8.4 1.1 1.1m0-10.6-1.1 1.1m-8.4 8.4-1.1 1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
							</svg>
							<span data-i18n="settingsLight">Light</span>
						</button>
						<button class="theme-option" type="button" data-theme-option="dark" aria-pressed="false">
							<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
								<path d="M16.8 12.2A7 7 0 0 1 7.8 3.2a7.1 7.1 0 1 0 9 9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
							</svg>
							<span data-i18n="settingsDark">Dark</span>
						</button>
					</div>
				</div>
			</section>
		</div>
		<footer id="update-status" class="update-status" data-state="checking" role="status" aria-live="polite">
			<span class="update-indicator" aria-hidden="true"></span>
			<span id="update-message" data-i18n="updateChecking">Checking for updates...</span>
		</footer>
	</main>
</body>
</html>
